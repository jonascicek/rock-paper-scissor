<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/thumb.svg" />
  <script type="module" defer src="/src/main.js"></script>
  <title>Rock Paper Scissors</title>
  <link href="./src/style.css" rel="stylesheet"/>
</head>
<body class="bg-gray-900 text-white font-metalmania">
  <!-- Header-Bereich -->
  <header>
    <h1>Rock Paper Scissors</h1>
    <div>
      <span>Score</span>
      <span id="score">0</span>
    </div>
  </header>

  <!-- Hauptbereich mit Buttons -->
  <main class="flex justify-center items-center gap-4">
    <button data-choice="paper" class="p-4 border rounded">
      <img src="/images/paper.svg" alt="Paper" class="w-16 h-16" />
    </button>
    <button data-choice="scissors" class="p-4 border rounded">
      <img src="/images/scissors.svg" alt="Scissors" class="w-16 h-16" />
    </button>
    <button data-choice="rock" class="p-4 border rounded">
      <img src="/images/rock.svg" alt="Rock" class="w-16 h-16" />
    </button>
  </main>

  <!-- Startbildschirm -->
  <div id="startscreen">
    <h1>Rock</h1>
    <h2>Paper</h2>
    <h3>Scissors</h3>
    <button id="startbutton">Start Game</button>
  </div>

  <!-- Regeln -->
  <div id="rules">
    <div>
      <h2 class="text-2xl font-bold">Rules</h2>
      <p>Rock Paper Scissors is a game that is played between two players...</p>
      <img src="/images/close.svg" alt="Close" id="closebutton"/>
    </div>
  </div>

  <!-- Ergebnisanzeige -->
  <div id="results">
    <h3 id="result">You win</h3>
    <div class="mt-4">
      <p class="text-xl">You chose:</p>
      <div id="userchoice" class="mt-2"></div>
    </div>
    <div class="mt-4">
      <p class="text-xl">Computer chose:</p>
      <div id="computerchoice" class="mt-2"></div>
    </div>
    <button id="playagain">
      Play Again
    </button>
  </div>
</body>
</html>
